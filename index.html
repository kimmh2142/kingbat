<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7dce4" />
    <title>직장인 킹받게 하기 : 승진의 기술</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #3b2a33;
        /* 모바일에서 길게 눌러도 텍스트 선택·메뉴·확대가 뜨지 않게 */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f7dce4;
        font: 20px sans-serif;
      }
      /* 휴대폰 세로 화면: 안내만 띄우고 게임은 막지 않는다 */
      #rotate {
        display: none;
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 999px;
        background: #fff59d;
        color: #5a3a4a;
        border: 3px solid #5a3a4a;
        font: 16px sans-serif;
        white-space: nowrap;
        pointer-events: none;
        z-index: 10;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">출근하는 중…</div>
    <div id="game"></div>
    <div id="rotate">📱 가로로 돌리면 더 크게 보여요</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
